.rw{position:relative}.rl{overflow-x:auto;scrollbar-width:none;height:84px}.rli{height:84px;margin:0 50%;background:repeating-linear-gradient(90deg,#777 0 1px,transparent 1px 8px) bottom/100% 28px no-repeat,repeating-linear-gradient(90deg,#ddd 0 2px,transparent 2px 80px) bottom/100% 54px no-repeat}
.rn{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--ac);border-radius:3px}
.tg input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:#333;position:relative;flex:none;padding:0;border:0}.tg input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg input:checked{background:var(--ac)}.tg input:checked::after{transform:translateX(20px);background:#10140a}
.prep{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:20px}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl{background:linear-gradient(160deg,#1b1b1b,#0e0e0e);border:1px solid var(--bd);border-radius:18px;padding:14px;color:var(--tx);font:inherit;text-align:start;display:flex;flex-direction:column;gap:4px;cursor:pointer}.tl.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}.tl small{color:var(--mut);font-size:12px}
.phc{display:grid;place-items:center;min-height:170px;border:2px dashed var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;text-align:center;position:relative;color:var(--mut)}.phc span{font-size:34px}.phc img{width:100%;height:150px;object-fit:cover}.phc input{display:none}
.seg button{font-size:13px;padding:9px 4px}

<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var GOALS={
 max:{n:'قوة قصوى',lo:85,hi:100,mid:90,r:[1,5],rest:'3–5 د',sets:'4–6',hrs:72},
 hyp:{n:'تضخيم',lo:65,hi:85,mid:75,r:[6,12],rest:'1.5–3 د',sets:'3–5',hrs:48},
 end:{n:'تحمل قوة',lo:40,hi:65,mid:55,r:[15,30],rest:'30–90 ث',sets:'2–4',hrs:36},
 pow:{n:'قوة انفجارية',lo:30,hi:60,mid:45,r:[1,5],rest:'2–4 د',sets:'3–6',hrs:48}
};
var BLOCKS={
 push:['بنش بريس','ضغط أكتاف دمبل','رفرفة جانبية','ترايسبس بوش داون'],
 pull:['سحب علوي','تجديف بار','فيس بول','كيرل بايسبس'],
 legs:['سكوات','ديدلفت روماني','ضغط أرجل','سمانة'],
 upper:['بنش بريس','تجديف بار','ضغط أكتاف دمبل','سحب علوي'],
 full:['سكوات','بنش بريس','تجديف بار','ضغط أكتاف دمبل']
};
var DRILL={push:'رمي كرة طبية',pull:'سوينغ كيتل بيل',legs:'قفز صندوق',upper:'رمي كرة طبية',full:'قفز صندوق'};
var SPLIT={3:[['جسم كامل أ','full'],['جسم كامل ب','full'],['جسم كامل ج','full']],
 4:[['علوي','upper'],['سفلي','legs'],['علوي','upper'],['سفلي','legs']],
 5:[['دفع','push'],['سحب','pull'],['أرجل','legs'],['علوي','upper'],['سفلي','legs']]};
var LIFTS=['بنش بريس','ضغط أكتاف دمبل','رفرفة جانبية','ترايسبس بوش داون','سحب علوي','تجديف بار','فيس بول','كيرل بايسبس','سكوات','ديدلفت روماني','ضغط أرجل','سمانة'];
var S={p:{age:24,h:175,w:75,exp:'متوسط',goal:'hyp',days:4},logs:[],rec:{sleep:7,sore:2,stress:2,en:4},day:0,tab:'plan',sel:'بنش بريس'};
try{var raw=localStorage.getItem('hadeed1');if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem('hadeed1',JSON.stringify(S))}catch(e){}}
function r25(x){return Math.max(2.5,Math.round(x/2.5)*2.5)}
function e1rm(w,r){return w*(1+r/30)}
function best(ex){var m=0;S.logs.forEach(function(l){if(l.ex===ex){var v=e1rm(l.w,l.r);if(v>m)m=v}});return m}
function setP(k,v){S.p[k]=(k==='exp'||k==='goal')?v:+v;save();draw()}
function go(t){S.tab=t;save();draw();window.scrollTo(0,0)}
function readiness(){var r=S.rec;return Math.round(Math.min(r.sleep/8,1)*40+(5-r.sore)/4*25+(5-r.stress)/4*15+(r.en-1)/4*20)}
function planTab(){
 var p=S.p,g=GOALS[p.goal],days=SPLIT[p.days],d=days[Math.min(S.day,days.length-1)],ex=BLOCKS[d[1]].slice();
 if(p.goal==='pow')ex.unshift(DRILL[d[1]]);
 var prot=Math.round(p.w*1.6)+'–'+Math.round(p.w*2.2);
 var h='<div class="brand">ميدان فِت<span>ميدانك</span></div><h1>خطتك</h1><p class="sub">بناء الجدول حسب الهدف والعمر والوزن</p>';
 h+='<div class="card"><h2>ملفك</h2><div class="grid">'+
 '<div><label>العمر</label><input type="number" value="'+p.age+'" onchange="setP(\'age\',this.value)"></div>'+
 '<div><label>الطول (سم)</label><input type="number" value="'+p.h+'" onchange="setP(\'h\',this.value)"></div>'+
 '<div><label>الوزن (كغ)</label><input type="number" value="'+p.w+'" onchange="setP(\'w\',this.value)"></div>'+
 '<div><label>الخبرة</label><select onchange="setP(\'exp\',this.value)">'+['مبتدئ','متوسط','متقدم'].map(function(x){return '<option'+(x===p.exp?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div></div>';
 if(p.age<18)h+='<div class="warn">تحت 18 سنة: ركّز على التكنيك وأوزان خفيفة، وتجنّب أقصى حمل (1RM) بدون مدرب.</div>';
 h+='</div><h2>هدف المرحلة</h2><div class="chips">'+Object.keys(GOALS).map(function(k){return '<button class="chip'+(k===p.goal?' on':'')+'" onclick="setP(\'goal\',\''+k+'\')">'+GOALS[k].n+'</button>'}).join('')+'</div>';
 h+='<div class="card"><div class="spec"><div><b>'+g.lo+'–'+g.hi+'%</b><span>الشدة</span></div><div><b>'+g.r[0]+'–'+g.r[1]+'</b><span>تكرارات</span></div><div><b>'+g.sets+'</b><span>مجموعات</span></div><div><b>'+g.rest+'</b><span>راحة</span></div></div>'+
 (p.goal==='pow'?'<p class="note">نفّذ كل تكرار بأقصى سرعة، وتوقف قبل أن تبطؤ الحركة.</p>':'')+'</div>';
 h+='<h2>أيام التدريب</h2><div class="chips">'+[3,4,5].map(function(n){return '<button class="chip'+(n===p.days?' on':'')+'" onclick="S.day=0;setP(\'days\','+n+')">'+n+' أيام</button>'}).join('')+'</div>';
 h+='<div class="chips">'+days.map(function(x,i){return '<button class="chip'+(i===S.day?' on':'')+'" onclick="S.day='+i+';save();draw()">'+(i+1)+'. '+x[0]+'</button>'}).join('')+'</div>';
 h+='<div class="card">'+ex.map(function(n){
  var b=best(n),isD=n===DRILL[d[1]]&&p.goal==='pow',w=b&&!isD?r25(b*g.mid/100):0;
  return '<div class="ex"><div><b>'+n+'</b><small>'+(isD?'3–5 تكرارات خفيفة وسريعة':g.sets+' × '+g.r[0]+'–'+g.r[1])+'</small></div>'+(w?'<span class="kg">'+w+' كغ</span>':'<small>'+(isD?'':'سجّل أول مجموعة')+'</small>')+'</div>'}).join('')+'</div>';
 h+='<div class="card"><h2>تغذية داعمة</h2><p class="sub" style="margin:0">بروتين يومي مقترح: <b>'+prot+' غ</b> (1.6–2.2 غ لكل كغ من وزنك).</p></div>';
 return h}
function logTab(){
 var g=GOALS[S.p.goal],h='<h1>التسجيل</h1><p class="sub">كل مجموعة تسجّلها تحدّث الوزن المقترح</p>';
 h+='<div class="card"><label>التمرين</label><select id="lx" onchange="S.sel=this.value">'+LIFTS.map(function(x){return '<option'+(x===S.sel?' selected':'')+'>'+x+'</option>'}).join('')+'</select><div class="grid" style="margin-top:10px"><div><label>الوزن (كغ)</label><input id="lw" type="number" inputmode="decimal" step="0.5"></div><div><label>التكرارات</label><input id="lr" type="number" inputmode="numeric"></div></div>'+
 '<label style="margin-top:10px">الجهد RPE (6–10)</label><div class="rng"><input id="le" type="range" min="6" max="10" step="0.5" value="8" oninput="document.getElementById(\'lv\').textContent=this.value"><b id="lv">8</b></div><button class="btn" onclick="addLog()">سجّل المجموعة</button></div>';
 var last=S.logs.filter(function(l){return l.ex===S.sel}).slice(-1)[0];
 if(last){var up=last.r>=g.r[1]&&last.e<=8,nx=up?last.w+2.5:last.w;
  h+='<div class="card"><h2>توصية الجلسة القادمة</h2><p style="margin:0">'+(up?'وصلت لأعلى نطاق التكرارات بجهد مريح: ارفع إلى <b>'+nx+' كغ</b>.':'ثبّت على <b>'+last.w+' كغ</b> واكسب تكرارات حتى '+g.r[1]+' بجهد 8 أو أقل قبل زيادة الوزن.')+'</p><p class="note">تقدير أقصى حمل (1RM): '+Math.round(best(S.sel))+' كغ</p></div>'}
 h+='<div class="card"><h2>آخر المجموعات</h2>'+(S.logs.length?S.logs.slice(-6).reverse().map(function(l){return '<div class="log"><span>'+l.ex+'</span><span>'+l.w+' كغ × '+l.r+' · RPE '+l.e+'</span></div>'}).join(''):'<p class="note">لا يوجد تسجيل بعد. أضف أول مجموعة من الأعلى.</p>')+'</div>';
 return h}
function addLog(){
 var w=parseFloat(document.getElementById('lw').value),r=parseInt(document.getElementById('lr').value,10),e=parseFloat(document.getElementById('le').value);
 if(!(w>0)||!(r>0)){alert('أدخل الوزن والتكرارات');return}
 S.sel=document.getElementById('lx').value;S.logs.push({ex:S.sel,w:w,r:r,e:e,t:Date.now()});save();draw()}
function recTab(){
 var s=readiness(),c=2*Math.PI*52,col=s>=75?'var(--ok)':s>=50?'var(--warn)':'var(--bad)',g=GOALS[S.p.goal];
 var msg=s>=75?'جاهز: نفّذ الجلسة كما هي.':s>=50?'جاهزية متوسطة: خفّف الحجم 10–20% وابقَ بعيداً عن الفشل.':'جاهزية منخفضة: الأفضل راحة أو مشي خفيف اليوم.';
 var fld=[['sleep','ساعات النوم',4,10,0.5],['sore','ألم العضلات (1 لا شيء – 5 شديد)',1,5,1],['stress','التوتر (1–5)',1,5,1],['en','الطاقة (1–5)',1,5,1]];
 var h='<h1>الاستشفاء</h1><p class="sub">درجة جاهزيتك لليوم</p><div class="card ringbox"><svg width="124" height="124" viewBox="0 0 124 124"><circle cx="62" cy="62" r="52" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="62" cy="62" r="52" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(s/100*c).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 62 62)"/><text x="62" y="70" text-anchor="middle" font-size="28" font-weight="800" fill="var(--tx)">'+s+'%</text></svg><div><b>'+msg+'</b></div></div>';
 h+='<div class="card">'+fld.map(function(f){return '<label>'+f[1]+'</label><div class="rng"><input type="range" min="'+f[2]+'" max="'+f[3]+'" step="'+f[4]+'" value="'+S.rec[f[0]]+'" oninput="S.rec.'+f[0]+'=+this.value;save();draw()"><b>'+S.rec[f[0]]+'</b></div>'}).join('')+'</div>';
 h+='<div class="card"><h2>راحة العضلة بين الجلسات</h2><p style="margin:0">لهدف '+g.n+': انتظر نحو <b>'+g.hrs+' ساعة</b> قبل تدريب نفس العضلة بشدة.</p><p class="note">تقدير عام، يختلف حسب النوم والتغذية وحجم التمرين.</p></div>';
 return h}
function coachTab(){
 var p=S.p,g=GOALS[p.goal],s=readiness(),t=[];
 t.push('هدفك الحالي: '+g.n+'. التزم بنطاق '+g.r[0]+'–'+g.r[1]+' تكرار وراحة '+g.rest+'.');
 t.push(s<50?'جاهزيتك منخفضة اليوم، قلّل الحجم أو خذ يوم راحة.':'جاهزيتك جيدة. ارفع الوزن فقط عندما تصل لأعلى نطاق التكرارات بجهد RPE 8 أو أقل.');
 if(p.exp==='مبتدئ')t.push('كمبتدئ: التكنيك أهم من الوزن. زد 2.5 كغ كحد أقصى كل أسبوع.');
 if(p.age<18)t.push('عمرك تحت 18: ابتعد عن المحاولات القصوى، وتدرّب بإشراف.');
 if(p.age>=40)t.push('بعد الأربعين: أطل الإحماء وزد وقت الاستشفاء بين الجلسات.');
 t.push('كل 4–6 أسابيع خُذ أسبوع تخفيف (Deload) بحجم أقل بنحو 40%.');
 return '<h1>المدرب</h1><p class="sub">توصيات مبنية على قواعد علمية وبياناتك</p><div class="card"><ul>'+t.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div><div class="card"><h2>المدرب الذكي (AI)</h2><p class="note" style="margin:0">في النسخة القادمة: اسأل عن تمرين أو ألم أو خطة، ويجيبك مدرب ذكي يعرف سجلّك.</p></div><div class="warn">التطبيق ليس بديلاً عن الطبيب. أي ألم حاد أو مستمر يحتاج مختصاً.</div>'}
var SPLASH=true;
function ic(p){return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}
var IC={home:ic(`<path d="M3 11l9-8 9 8M5 10v10h14V10"/>`),plan:ic(`<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>`),log:ic(`<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>`),rec:ic(`<path d="M20 14a8 8 0 1 1-10-10 6 6 0 0 0 10 10z"/>`),coach:ic(`<path d="M4 5h16v11H9l-5 4z"/>`)};
function splashHtml(){return `<div class="sp"><div class="rd"></div><div class="brand" style="font-size:17px">ميدان فِت</div><h1>تجاوز<br>حدودك<br><em>كل يوم</em></h1><p>تدريب مبني على العلم، واستشفاء ذكي، لكل رياضة.</p><button class="go" onclick="start()">ابدأ الآن ←</button></div>`}
function start(){SPLASH=false;S.tab='home';draw();window.scrollTo(0,0)}
function homeTab(){
 var p=S.p,g=GOALS[p.goal],days=SPLIT[p.days],d=days[Math.min(S.day,days.length-1)],n=BLOCKS[d[1]].length+(p.goal==='pow'?1:0),s=readiness(),c=2*Math.PI*40,col=s>=75?'var(--ok)':s>=50?'var(--warn)':'var(--bad)',vol=Math.round(S.logs.reduce(function(a,l){return a+l.w*l.r},0));
 var msg=s>=75?'جاهز لجلسة كاملة':s>=50?'خفّف الحجم قليلاً':'الأفضل راحة اليوم';
 return `<div class="brand">ميدان فِت<span>ميدانك</span></div><h1>أهلاً بك</h1><p class="sub">جاهز لجلسة اليوم؟</p>
<div class="hero"><small>جلسة اليوم: ${g.n}</small><h2>${d[0]}</h2><div class="meta"><span>${n} تمارين</span><span>${n*12} دقيقة تقريباً</span></div><button onclick="go('plan')">ابدأ الجلسة ←</button></div>
<div class="card ringbox"><svg width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="الجاهزية ${s}%"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--bd)" stroke-width="11"/><circle cx="50" cy="50" r="40" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(s/100*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="22" font-weight="800" fill="var(--tx)">${s}%</text></svg><div><b>جاهزيتك اليوم</b><p class="note">${msg}</p></div></div>
${calCard()}<h2>نشاطك</h2><div class="stats"><div class="stat">${ci('<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>','#FEFFFC')}<b>${S.logs.length}</b><span>مجموعات</span></div><div class="stat">${ci('<path d="M6 9h12l1 11H5zM9 9a3 3 0 1 1 6 0"/>','#D0FF00')}<b>${vol.toLocaleString('en')}</b><span>كغ حجم</span></div><div class="stat">${ci('<path d="M5 6h14v14H5zM5 11h14M9 3v4M15 3v4"/>','#8116E0')}<b>${p.days}</b><span>أيام بالأسبوع</span></div></div>`}
function draw(){
 document.documentElement.dir=((SPLASH||ONB)&&S.lang==='en')?'ltr':'rtl';
 if(SPLASH){document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=splashHtml();return}
 if(ONB){document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=onbHtml();return}
 var T={home:homeTab,plan:planTab,log:logTab,rec:recTab,coach:coachTab};
 document.getElementById('app').innerHTML=T[S.tab]();
 var N=[['plan','📋','الخطة'],['log','🏋️','التسجيل'],['rec','💤','الاستشفاء'],['coach','💬','المدرب']];
 document.getElementById('nav').innerHTML=[['home','','الرئيسية']].concat(N).map(function(n){return '<button class="'+(S.tab===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><i>'+IC[n[0]]+'</i>'+n[2]+'</button>'}).join('')}
var ONB=false,OS=0,LIM={age:[12,80],h:[120,230],w:[30,250]};
var ST=[
{k:'sex',t:'c',o:[['m','ذكر','Male'],['f','أنثى','Female']],q:['ما جنسك؟','What is your sex?']},
{k:'age',t:'n',u:['سنة','years'],q:['كم عمرك؟','How old are you?']},
{k:'h',t:'n',u:['سم','cm'],q:['كم طولك؟','How tall are you?']},
{k:'w',t:'n',u:['كغ','kg'],q:['كم وزنك؟','What is your weight?']},
{k:'life',t:'c',o:[['1.2','مكتبي، حركة قليلة','Desk job, little movement'],['1.3','حركة خفيفة خلال اليوم','Light daily movement'],['1.4','عمل بدني أو مشي كثير','Physical job or lots of walking']],q:['كيف يومك العادي خارج التمرين؟','How active is your day outside training?']},
{k:'days',t:'c',o:[['3','3 أيام','3 days'],['4','4 أيام','4 days'],['5','5 أيام','5 days']],q:['كم يوم تتدرب بالأسبوع؟','How many days do you train per week?']},
{k:'exp',t:'c',o:[['مبتدئ','مبتدئ','Beginner'],['متوسط','متوسط','Intermediate'],['متقدم','متقدم','Advanced']],q:['ما مستوى خبرتك؟','What is your experience level?']},
{k:'goal',t:'c',o:[['max','قوة قصوى','Max strength'],['hyp','تضخيم','Hypertrophy'],['end','تحمل قوة','Strength endurance'],['pow','قوة انفجارية','Explosive power']],q:['ما هدف تدريبك الأساسي؟','What is your main training goal?']},
{k:'cg',t:'c',o:[['cut','تنشيف (خسارة دهون)','Lose fat'],['keep','ثبات الوزن','Maintain weight'],['bulk','زيادة كتلة','Gain muscle']],q:['ما هدفك بالوزن؟','What is your weight goal?']}
];

function L(a){return a[S.lang==='en'?1:0]}
function langBtn(){return `<button class="lg" onclick="setLang('${S.lang==='en'?'ar':'en'}')">${S.lang==='en'?'العربية':'English'}</button>`}
function setLang(l){S.lang=l;save();draw()}
function splashHtml(){var en=S.lang==='en';return `<div class="sp"><div class="rd"></div><div class="fig">${FIG}</div>${langBtn()}<div class="logo">MAYDAN FIT</div><div class="logo2">ميدان فِت</div><h1>${en?'Push<br>your limits<br><em>every day</em>':'تجاوز<br>حدودك<br><em>كل يوم</em>'}</h1><p>${en?'Science-based training and smart recovery, for every sport.':'تدريب مبني على العلم، واستشفاء ذكي، لكل رياضة.'}</p><button class="go" onclick="start()">${en?'Get started →':'ابدأ الآن ←'}</button></div>`}
function start(){SPLASH=false;if(S.done){S.tab='home'}else{ONB=true;OS=0}draw();window.scrollTo(0,0)}
function pick(k,v){S.p[k]=(k==='life'||k==='days')?+v:v;save();OS++;draw();window.scrollTo(0,0)}
function clampK(k,v){var m=LIM[k];v=Math.round(+v)||S.p[k];return Math.min(m[1],Math.max(m[0],v))}
function step(k,d){S.p[k]=clampK(k,+S.p[k]+d);save();draw()}
function setNum(k,v){S.p[k]=clampK(k,v);save();draw()}
function obNext(){var i=document.getElementById('nv'),k=ST[OS].k;if(i)S.p[k]=clampK(k,i.value);save();OS++;draw();window.scrollTo(0,0)}
function obBack(){if(OS===0){ONB=false;SPLASH=true}else OS--;draw()}
function finish(){S.done=true;ONB=false;S.tab='home';save();draw();window.scrollTo(0,0)}
function onbHtml(){
 var n=ST.length,en=S.lang==='en';
 if(OS>=n)return resHtml();
 var s=ST[OS],cur=S.p[s.k],h=`<div class="ob"><div class="bar"><i style="width:${(OS+1)/n*100}%"></i></div><div class="top"><button class="bk" onclick="obBack()">${en?'← Back':'رجوع →'}</button><span>${OS+1}/${n}</span>${langBtn()}</div><h1>${L(s.q)}</h1>`;
 if(s.t==='c'){h+='<div class="opts">'+s.o.map(function(o){return `<button class="opt${String(cur)===o[0]?' on':''}" onclick="pick('${s.k}','${o[0]}')">${en?o[2]:o[1]}</button>`}).join('')+'</div>'}
 else{h+=`<div class="numbox"><button onclick="step('${s.k}',-1)" aria-label="-">−</button><input id="nv" type="number" inputmode="numeric" value="${cur}" onchange="setNum('${s.k}',this.value)"><button onclick="step('${s.k}',1)" aria-label="+">+</button></div><div class="unit">${L(s.u)}</div><button class="go" onclick="obNext()">${en?'Next':'التالي'}</button>`}
 return h+'</div>'}
function calc(){var p=S.p,bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5),base=bmr*(+p.life||1.2),wit=base+p.days*5*p.w/7,adj=(p.cg==='cut'&&p.age>=18)?-0.15:p.cg==='bulk'?0.1:0;return{bmr:bmr,base:base,wit:wit,tg:wit*(1+adj)}}
function calCard(){if(!S.done)return'';var c=calc();return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>هدفك اليومي</b><b style="font-size:22px;color:var(--ac)">${Math.round(c.tg)} kcal</b></div><p class="note">مع التمارين ${Math.round(c.wit)} سعرة، وبدون تمارين ${Math.round(c.base)} سعرة.</p></div>`}
function resHtml(){
 var c=calc(),en=S.lang==='en',p=S.p,pr=Math.round(p.w*1.6)+'–'+Math.round(p.w*2.2);

 var cgn={cut:en?'Fat loss':'تنشيف',keep:en?'Maintenance':'ثبات الوزن',bulk:en?'Muscle gain':'زيادة كتلة'}[p.cg];
