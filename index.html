<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميدان فِت</title>
<meta name="description" content="ميدان فِت: تدريب علمي واستشفاء ذكي لكل رياضة. Maydan Fit: science-based training and smart recovery.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D0FF00'/%3E%3Cpath d='M16 26v12M10 29v6M48 26v12M54 29v6M16 32h32' stroke='%2310140a' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ميدان فِت — Maydan Fit
   Design tokens → base → components → screens → overlays → motion
   ========================================================================== */

:root {
  color-scheme: dark;
  --bg: #000;
  --card: #141414;
  --card-2: #0e0e0e;
  --tx: #fefffc;
  --mut: #9aa0aa;
  --ac: #d0ff00;
  --ac-soft: #1d2300;
  --ac-ink: #10140a;
  --vi: #8116e0;
  --vi-deep: #3d0a73;
  --wh: #fefffc;
  --bd: #262626;
  --ok: var(--ac);
  --warn: var(--wh);
  --bad: var(--vi);
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-pill: 999px;
  --maxw: 560px;
  --nav-h: 84px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  min-height: 100svh;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  font-family: Tajawal, system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.6;
  color: var(--tx);
  background:
    radial-gradient(90% 38% at 100% 0, rgba(129, 22, 224, .38), transparent 62%),
    radial-gradient(80% 30% at 0 100%, rgba(208, 255, 0, .10), transparent 60%),
    var(--bg);
  background-repeat: no-repeat;
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
h1 { font-size: 26px; font-weight: 800; line-height: 1.25; margin: 4px 0 6px; }
h2 { font-size: 17px; font-weight: 700; margin: 18px 0 10px; }
h2:first-child { margin-top: 0; }
p { margin: 0; }
b { font-weight: 700; }
ul { margin: 0; padding-inline-start: 18px; }
li { margin-bottom: 6px; font-size: 15px; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
[hidden] { display: none !important; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; inset-inline-start: 8px; top: -60px; z-index: 100;
  background: var(--ac); color: var(--ac-ink); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 700;
}
.skip:focus { top: 8px; }

/* ---------- typography helpers ---------- */
.sub { color: var(--mut); font-size: 14px; margin: 0 0 14px; }
.note { font-size: 13px; color: var(--mut); margin: 8px 0 0; }
.brand { font-weight: 800; font-size: 15px; color: var(--ac); }
.brand span { color: var(--mut); font-weight: 500; font-size: 13px; margin-inline-start: 8px; }
.big { font-size: 34px; line-height: 1; }
.hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mut { color: var(--mut); }
.vi { color: var(--vi); }
.ac { color: var(--ac); }

/* ---------- surfaces ---------- */
.card {
  background: linear-gradient(160deg, #1b1b1b, var(--card-2));
  border: 1px solid var(--bd);
  border-radius: var(--r-lg);
  padding: 14px;
  margin-bottom: 12px;
}
button.card { width: 100%; text-align: start; color: inherit; cursor: pointer; font: inherit; }
.card.w { background: var(--wh); color: #0b0b0b; border: 0; }
.card.w small { color: #555; }
.card.w p { font-size: 18px; font-weight: 700; margin-top: 6px; }
.card.v { background: linear-gradient(160deg, var(--vi), var(--vi-deep)); border: 0; }
.card.v .note { color: #efe2ff; }
.flex { display: flex; align-items: center; gap: 12px; }
.warn { background: #3a2a0b; color: #ffd58a; border-radius: var(--r-sm); padding: 8px 10px; font-size: 13px; margin-top: 10px; }

/* ---------- forms ---------- */
label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 4px; }
input, select {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 12px;
  border: 1px solid var(--bd); border-radius: var(--r-sm);
  background: var(--bg); color: var(--tx); min-height: 44px;
}
input::placeholder { color: #666; }
input[type=range] { padding: 0; min-height: 28px; accent-color: var(--ac); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rng { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
.rng b { min-width: 34px; text-align: center; }

/* ---------- buttons ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--bd); background: var(--card); color: var(--tx);
  font-size: 14px; padding: 8px 14px; min-height: 40px; border-radius: var(--r-pill);
  transition: background .2s, color .2s, border-color .2s;
}
.chip[aria-pressed=true] { background: var(--ac); border-color: var(--ac); color: var(--ac-ink); font-weight: 700; }
.bk, .lg {
  background: var(--card); border: 1px solid var(--bd); color: var(--tx);
  border-radius: var(--r-pill); font-size: 14px; padding: 8px 14px; min-height: 40px;
}
.bk:active, .chip:active { transform: scale(.96); }
.btn {
  width: 100%; font-weight: 700; font-size: 16px; padding: 13px; border: 0;
  border-radius: 14px; background: var(--ac); color: var(--ac-ink); margin-top: 10px;
}
.go {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 8px 8px 24px; border: 0; border-radius: var(--r-pill);
  background: linear-gradient(180deg, #e3ff4a, var(--ac)); color: var(--ac-ink);
  font-weight: 800; font-size: 18px; min-height: 58px;
  box-shadow: 0 10px 26px rgba(198, 244, 50, .22);
  transition: transform .15s var(--ease);
}
.go::after {
  content: "→"; width: 46px; height: 46px; border-radius: 50%;
  background: var(--ac-ink); color: var(--ac); display: grid; place-items: center; font-size: 22px;
}
:root[dir=rtl] .go { padding: 8px 24px 8px 8px; }
:root[dir=rtl] .go::after { content: "←"; }
.go:active { transform: scale(.98); }
.go.plain::after { content: none; }
.go.plain { justify-content: center; padding: 8px 24px; }

/* ---------- navigation ---------- */
nav {
  position: fixed; inset-inline: 0; margin-inline: auto; z-index: 30;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 24px), calc(var(--maxw) - 24px));
  display: flex; padding: 6px;
  background: rgba(20, 16, 28, .92); border: 1px solid #3a2a55; border-radius: 28px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
nav button {
  flex: 1; background: none; border: 0; border-radius: 22px; padding: 8px 2px;
  font-size: 12px; color: #a79bb8; min-height: 52px;
  transition: background .25s, color .25s;
}
nav button:active { transform: scale(.9); }
nav button svg { display: block; margin: 0 auto 2px; color: currentColor; }
nav button[aria-current=page] { background: var(--ac); color: var(--ac-ink); font-weight: 800; animation: bump .4s ease-out both; }

/* ---------- lists / rows ---------- */
.ex { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--bd); }
.ex:first-child { border-top: 0; padding-top: 0; }
.ex:last-child { padding-bottom: 0; }
.ex small { color: var(--mut); display: block; font-size: 13px; }
.kg { background: var(--ac-soft); color: var(--ac); font-weight: 800; border-radius: var(--r-sm); padding: 6px 10px; white-space: nowrap; font-size: 15px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--bd); }
.row:first-child { border-top: 0; }
.row.nb { border: 0; padding: 0; }
.log { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; border-top: 1px solid var(--bd); }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 12px 4px; text-align: center; }
.stat b { display: block; font-size: 20px; }
.stat span { font-size: 12px; color: var(--mut); }
.card > .stats { margin-bottom: 0; }
.stat .ci { margin: 0 auto 6px; }
.ci { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; flex: none; }
.ringbox { display: flex; align-items: center; gap: 14px; }
.ringbox svg { flex: none; }

/* ---------- hero ---------- */
.hero {
  background: linear-gradient(160deg, var(--ac), #b6e400); color: var(--ac-ink);
  border-radius: 24px; padding: 18px; margin-bottom: 12px;
  box-shadow: 0 10px 30px rgba(198, 244, 50, .18);
}
.hero small { font-size: 13px; font-weight: 500; }
.hero h2 { font-size: 26px; font-weight: 800; margin: 2px 0 10px; }
.hero .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin-bottom: 14px; }
.hero button { background: var(--ac-ink); color: var(--ac); border: 0; border-radius: var(--r-pill); font-weight: 700; padding: 12px 24px; min-height: 44px; }

/* ---------- plan ---------- */
.spec { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.spec div { background: var(--ac-soft); border-radius: var(--r-sm); padding: 8px 2px; }
.spec b { display: block; font-size: 16px; }
.spec span { font-size: 12px; color: var(--mut); }

/* ---------- session ---------- */
.pbar { height: 6px; background: var(--bd); border-radius: 9px; overflow: hidden; margin: 6px 0 12px; }
.pbar i { display: block; height: 100%; background: var(--ac); transition: width .4s; }
.st { display: grid; grid-template-columns: 22px 1fr 1fr 48px; gap: 8px; align-items: center; margin-top: 8px; }
.st.single { grid-template-columns: 1fr 48px; }
.st input { text-align: center; padding: 8px; }
.cb {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--bd);
  background: none; color: var(--ac-ink); font-size: 22px; font-weight: 800;
}
.st.ok { opacity: .75; }
.st.ok .cb { background: var(--ac); border-color: var(--ac); animation: pop2 .4s; }

/* ---------- calendar / streak ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal small { color: var(--mut); font-size: 11px; }
.cal span { padding: 8px 0; border-radius: 50%; font-size: 14px; }
.cal .tr { background: var(--ac); color: var(--ac-ink); font-weight: 800; }
.cal .wo { background: var(--vi); color: #fff; font-weight: 800; }
.cal .td { outline: 2px solid var(--tx); }
.skh { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--bd); padding-bottom: 12px; margin-bottom: 12px; }
.skh small { display: block; color: var(--mut); letter-spacing: 1px; font-size: 12px; }
.cm { margin-inline-start: auto; text-align: center; background: var(--vi); border-radius: var(--r-md); padding: 8px 12px; }
.cm small { color: #efe2ff !important; }
.cm b { font-size: 20px; }
.fl { animation: flick 1.2s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(208, 255, 0, .6)); }
.wk { display: flex; justify-content: space-between; margin-bottom: 12px; text-align: center; }
.wk small { display: block; font-size: 11px; color: var(--mut); margin-top: 4px; }
.wc { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--bd); color: var(--ac-ink); font-weight: 800; margin: 0 auto; }
.wc.ok { background: var(--ac); }
.wc.td { background: none; border: 2px solid var(--ac); }
.rg2 { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--bd); font-size: 13px; margin: 0 auto; }
.rg2.ok { border-color: var(--ac); }
.rg2.td { border-color: var(--wh); }
.seg { display: flex; background: var(--card); border-radius: var(--r-pill); padding: 4px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; color: var(--mut); padding: 10px; min-height: 44px; border-radius: var(--r-pill); }
.seg button[aria-pressed=true] { background: var(--vi); color: #fff; }
.bds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bd { text-align: center; padding: 12px 6px; }
.hx { display: grid; place-items: center; width: 46px; height: 52px; margin: 0 auto 6px; background: #333; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-weight: 800; }
.bd.on .hx { background: var(--ac); color: var(--ac-ink); }

/* ---------- stories ---------- */
.sr { display: flex; gap: 14px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
.sr::-webkit-scrollbar { display: none; }
.story { background: none; border: 0; text-align: center; flex: none; }
.story .rg { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--c); padding: 3px; }
.story .in { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: #1a1a1a; }
.story small { display: block; font-size: 12px; margin-top: 4px; }

/* ---------- welcome / onboarding ---------- */
.sp { position: relative; overflow: hidden; min-height: calc(100svh - 110px); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 2px 8px; }
.sp > * { position: relative; z-index: 1; }
.sp h1 { font-size: 40px; line-height: 1.1; font-weight: 800; margin: 14px 0 12px; }
.sp em, .ob em { color: var(--ac); font-style: normal; }
.sp p { color: #c9ced6; font-size: 16px; max-width: 320px; margin: 0 0 22px; }
.sp .lg { position: absolute; top: 0; inset-inline-end: 0; z-index: 2; }
.photo { position: absolute !important; inset: -16px -14px 0; z-index: 0 !important; background-size: cover; background-position: center 12%; }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, .78) 74%, #000 97%); }
.boot { min-height: calc(100svh - 110px); display: grid; place-items: center; text-align: center; }
.boot img { width: min(74vw, 290px); height: auto; border-radius: 28px; animation: flyup 1s ease-in-out both; }
.ob { min-height: calc(100svh - 110px); display: flex; flex-direction: column; }
.ob .bar { height: 5px; background: var(--bd); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
.ob .bar i { display: block; height: 100%; background: var(--ac); transition: width .3s; }
.ob .top { display: flex; justify-content: space-between; align-items: center; color: var(--mut); font-size: 14px; margin-bottom: 26px; }
.ob h1 { font-size: 30px; margin: 0 0 22px; }
.opts { display: grid; gap: 10px; }
.opt {
  background: var(--card); border: 1px solid var(--bd); color: var(--tx);
  font-size: 18px; font-weight: 500; padding: 16px; border-radius: var(--r-md);
  text-align: start; min-height: 56px;
}
.opt[aria-pressed=true] { border-color: var(--ac); background: var(--ac-soft); }
.opt.acct { display: flex; align-items: center; gap: 12px; }
.numbox { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.numbox button { width: 56px; height: 56px; flex: none; border-radius: 50%; border: 1px solid var(--bd); background: var(--card); color: var(--ac); font-size: 28px; }
.numbox input { flex: 1; min-width: 0; text-align: center; font-size: 48px; font-weight: 800; border: 0; background: transparent; padding: 0; min-height: 64px; }
.unit { text-align: center; color: var(--mut); margin: 4px 0 26px; }
.txt { font-size: 26px; font-weight: 700; padding: 16px; border-radius: var(--r-md); }
.dots i { display: inline-block; width: 8px; height: 8px; border-radius: 9px; background: #333; margin: 0 3px; transition: width .2s; }
.dots i.on { background: var(--ac); width: 22px; }
.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 2px solid transparent; border-radius: 18px; padding: 14px; color: #fff; font-size: 17px; font-weight: 700; display: flex; flex-direction: column; gap: 26px; align-items: flex-start; min-height: 120px; }
.tile[aria-pressed=true] { border-color: var(--ac); }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; background: rgba(0, 0, 0, .6); }
.ov.show { display: flex; }
.sh {
  width: 100%; max-width: var(--maxw); margin: 0 auto; background: #141414;
  border-radius: 28px 28px 0 0; padding: 22px 22px calc(26px + env(safe-area-inset-bottom, 0px));
  text-align: center; animation: up .3s var(--ease); max-height: 90svh; overflow-y: auto;
}
.sh.start { text-align: start; }
.spb { height: 3px; background: var(--bd); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
.spb i { display: block; height: 100%; background: var(--ac); animation: fill 6s linear forwards; }
.cel { position: fixed; inset: 0; z-index: 60; display: none; overflow: auto; background: radial-gradient(100% 60% at 50% 15%, #4a0a85, #000 72%); }
.cel.show { display: block; animation: up .4s; }
.cin { max-width: var(--maxw); margin: 0 auto; padding: 40px 18px 30px; text-align: center; }
.bigfl { position: relative; display: inline-block; }
.bigfl b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 56px; color: var(--ac-ink); padding-top: 36px; }
.toast {
  position: fixed; inset-inline: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px);
  bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  background: var(--tx); color: #0b0b0b; font-weight: 700; padding: 10px 18px; border-radius: var(--r-pill);
  animation: up .25s var(--ease);
}

/* ---------- motion ---------- */
.anim .pg, .anim .pg > * { animation: up .45s ease-out both; }
.anim .pg > :nth-child(2) { animation-delay: .05s; }
.anim .pg > :nth-child(3) { animation-delay: .1s; }
.anim .pg > :nth-child(4) { animation-delay: .15s; }
.anim .pg > :nth-child(n+5) { animation-delay: .2s; }
.anim .ob, .anim .sp { animation: up .5s ease-out both; }
.anim .opts .opt { animation: up .35s ease-out both; }
.anim .opts .opt:nth-child(2) { animation-delay: .06s; }
.anim .opts .opt:nth-child(3) { animation-delay: .12s; }
.anim .opts .opt:nth-child(n+4) { animation-delay: .18s; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pop2 { 0% { transform: scale(.4); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1.04); } }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.1) rotate(3deg); } }
@keyframes fill { from { width: 0; } to { width: 100%; } }
@keyframes flyup { 0% { opacity: 0; transform: scale(.7); } 35% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-34vh) scale(.3); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

/* ---------- state ---------- */
const DEFAULTS = () => ({
  v: 2, lang: 'ar', sport: 'gym', done: false, acct: null, tab: 'home', day: 0, pt: 'r', mo: 0,
  p: { name: '', sex: 'm', age: 24, h: 175, w: 75, life: 1.2, days: 4, exp: 'mid', goal: 'hyp', cg: 'keep', split: 'auto' },
  logs: [], hist: [], pr: {}, act: {},
  rec: { d: '', sleep: 7, sore: 2, stress: 2, en: 4 },
  wt: { d: '', n: 0 }, sp: { d: '', n: 0 },
  sess: null, f: {}, prefs: { rest: true, sound: true }
});

function load() {
  const s = DEFAULTS();
  let raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); } catch (e) { /* storage blocked */ }
  if (!raw) return s;
  let o;
  try { o = JSON.parse(raw); } catch (e) { return s; }
  if (!o || typeof o !== 'object') return s;

  const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (isObj(o.p)) for (const k of Object.keys(s.p)) if (o.p[k] !== undefined) s.p[k] = o.p[k];
  for (const k of ['lang', 'sport', 'done', 'acct', 'tab', 'day', 'pt', 'mo', 'sess']) if (o[k] !== undefined) s[k] = o[k];
  for (const k of ['rec', 'wt', 'sp', 'f', 'prefs', 'pr', 'act']) if (isObj(o[k])) s[k] = Object.assign(s[k], o[k]);
  if (Array.isArray(o.logs)) s.logs = o.logs.filter(l => l && l.ex && l.w > 0 && l.r > 0).slice(-MAX_LOGS);
  if (Array.isArray(o.hist)) s.hist = o.hist.filter(h => h && typeof h.d === 'string').slice(-MAX_HIST);

  /* normalise */
  const p = s.p, legacyExp = { 'مبتدئ': 'beg', 'متوسط': 'mid', 'متقدم': 'adv' };
  p.exp = legacyExp[p.exp] || p.exp;
  if (!LEVELS.some(l => l[0] === p.exp)) p.exp = 'mid';
  if (!GOALS[p.goal]) p.goal = 'hyp';
  for (const k of ['age', 'h', 'w']) p[k] = clamp(Math.round(+p[k]) || DEFAULTS().p[k], LIMITS[k][0], LIMITS[k][1]);
  p.days = clamp(Math.round(+p.days) || 4, 2, 6);
  p.life = [1.2, 1.3, 1.4].includes(+p.life) ? +p.life : 1.2;
  p.name = String(p.name || '').slice(0, 24);
  if (!['m', 'f'].includes(p.sex)) p.sex = 'm';
  if (!['auto', 'ppl', 'arn', 'reg'].includes(p.split)) p.split = 'auto';
  if (!['cut', 'keep', 'bulk'].includes(p.cg)) p.cg = 'keep';
  if (s.lang !== 'en') s.lang = 'ar';
  if (!SPORTS.some(x => x.id === s.sport)) s.sport = 'gym';
  if (!TABS.includes(s.tab)) s.tab = 'home';
  s.day = Math.max(0, Math.round(+s.day) || 0);
  if (s.sess && !(isObj(s.sess) && isObj(s.sess.ck))) s.sess = null;
  return s;
}

let S = load();
function save() {
  try {
    S.logs = S.logs.slice(-MAX_LOGS); S.hist = S.hist.slice(-MAX_HIST);
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) { /* quota or private mode: app still works for this session */ }
}

/* transient UI state (not persisted) */
const UI = { phase: 'boot', is: 0, os: 0, email: false, libN: 10, ret: null };

/* ---------- i18n ---------- */
const isEn = () => S.lang === 'en';
const t = (ar, en) => (isEn() ? en : ar);
const pair = p => p[isEn() ? 1 : 0];
const tn = s => (isEn() ? (EN[s] || s) : s);
const gname = k => GOALS[k][isEn() ? 'en' : 'ar'];
const spname = id => { const x = SPORTS.find(s => s.id === id) || SPORTS[0]; return x[isEn() ? 'en' : 'ar']; };

/* ==========================================================================
   ENGINE — pure(ish) domain logic
   ========================================================================== */
const goal = () => GOALS[S.p.goal] || GOALS.hyp;
const sport = () => S.sport || 'gym';
const today = () => ds();

const waterN = () => (S.wt.d === today() ? S.wt.n : 0);
const stepsN = () => (S.sp.d === today() ? S.sp.n : 0);
const waterGoal = () => Math.ceil(S.p.w * 35 / 250);
const doneToday = () => S.hist.some(x => x.d === today());

function best(ex) { let m = 0; for (const l of S.logs) if (l.ex === ex) { const v = e1rm(l.w, l.r); if (v > m) m = v; } return m; }
const lastW = n => (S.pr[n] && S.pr[n].l) || 0;
const suggest = n => { const b = best(n); return b ? r25(b * goal().mid / 100) : lastW(n); };

function readiness(r = S.rec) {
  return clamp(Math.round(Math.min(r.sleep / 8, 1) * 40 + (5 - r.sore) / 4 * 25 + (5 - r.stress) / 4 * 15 + (r.en - 1) / 4 * 20), 0, 100);
}
const readyColor = s => (s >= 75 ? 'var(--ok)' : s >= 50 ? 'var(--warn)' : 'var(--bad)');
const readyMsg = s => (s >= 75 ? t('جاهز: نفّذ الجلسة كما هي.', 'Ready: do the session as planned.')
  : s >= 50 ? t('جاهزية متوسطة: خفّف الحجم 10–20% وابقَ بعيداً عن الفشل.', 'Moderate readiness: cut volume 10–20% and stay away from failure.')
  : t('جاهزية منخفضة: الأفضل راحة أو مشي خفيف اليوم.', 'Low readiness: rest or a light walk is best today.'));

/* Mifflin–St Jeor; training calories ≈ 5 kcal·kg⁻¹ per session, averaged over the week */
function calc() {
  const p = S.p, bmr = 10 * p.w + 6.25 * p.h - 5 * p.age + (p.sex === 'f' ? -161 : 5);
  const base = bmr * (+p.life || 1.2), wit = base + p.days * 5 * p.w / 7;
  const adj = (p.cg === 'cut' && p.age >= 18) ? -0.15 : p.cg === 'bulk' ? 0.1 : 0;
  return { bmr, base, wit, tg: wit * (1 + adj) };
}


/* which program does the user get? */
function plan(n) {
  const p = S.p, d = clamp(+n || +p.days || 4, 2, 6), sp = sport();
  if (p.goal === 'health') return { n: ['مسار الصحة واللياقة', 'Health & fitness track'], w: W.health, d: parseDays(HEALTH[d]) };
  if (sp !== 'gym') { const q = SPORT_PROGRAMS[sp]; return { n: q.n, w: q.w, d: parseDays(q.d[d]) }; }
  const m = GYM_SPLITS[p.split];
  if (m && d >= 3) return { n: m.n, w: m.w, d: parseDays(m.d[d]) };
  if (d <= 3) return { n: d < 3 ? ['جسم كامل (أ / ب)', 'Full body (A / B)'] : ['جسم كامل (أ / ب / ج)', 'Full body (A / B / C)'], w: W.fullBody, d: parseDays(d < 3 ? 'fa:جسم كامل أ,fb:جسم كامل ب' : REG[3]) };
  if (d === 4) return { n: ['علوي / سفلي', 'Upper / Lower'], w: W.upLow, d: parseDays(REG[4]) };
  const adv = p.exp === 'adv';
  if (d === 5) return adv ? { n: ['أرنولد (5 أيام)', 'Arnold (5 days)'], w: W.arnold, d: parseDays(ARN[5]) }
    : { n: ['دفع / سحب / أرجل + علوي / سفلي', 'Push / Pull / Legs + Upper / Lower'], w: W.ppl, d: parseDays(PPL[5]) };
  return adv ? { n: ['أرنولد (مرتين أسبوعياً)', 'Arnold (twice weekly)'], w: W.arnold, d: parseDays(ARN[6]) }
    : { n: ['دفع / سحب / أرجل (مرتين أسبوعياً)', 'Push / Pull / Legs (twice weekly)'], w: W.ppl, d: parseDays(PPL[6]) };
}

/* one source of truth for the selected day's exercises: used by Plan AND Session */
const SETS_RE = /^(\d+)(?:–\d+)?\s*×\s*(?:\d+–)?(\d+)$/;     // "3 × 5–8", "3–4 × 4–6"
function dayRows() {
  const p = S.p, g = goal(), pl = plan(), days = pl.d, di = clamp(S.day, 0, days.length - 1), dd = days[di], tp = TPL[dd.k], rows = [];
  const add = o => rows.push(Object.assign({ s: 1, r: 0, rest: 0, w: 0, kind: 'lift' }, o));

  if (p.goal === 'pow' && tp.dr && !tp.t) {
    add({ n: tp.dr, kind: 'drill', s: 3, r: 4, rest: 150, w: lastW(tp.dr), pr: ['3 × 3–5 بسرعة قصوى، راحة 2–3 د', '3 × 3–5 at max speed, rest 2–3 min'] });
  }
  for (const e of tp.x) {
    if (tp.t === 'hc') add({ n: e.n, kind: 'timed', pr: e.sub });
    else if (tp.t === 'hm') add({ n: e.n, kind: 'timed', pr: ['2 × 30–45 ث بدون ألم', '2 × 30–45 s pain-free'] });
    else if (tp.t === 'hs') add({ n: e.n, s: 3, r: 12, rest: 60, w: lastW(e.n), pr: ['3 × 10–15، راحة 60–90 ث', '3 × 10–15, rest 60–90 s'] });
    else if (tp.t === 'f') {
      const m = SETS_RE.exec(e.sub[0]);
      if (m) add({ n: e.n, s: +m[1], r: +m[2], rest: 90, w: lastW(e.n), pr: e.sub });
      else add({ n: e.n, kind: 'timed', pr: e.sub });
    } else if (e.c) {
      add({ n: e.n, s: parseInt(g.sets, 10) || 3, r: g.r[1], rest: g.restSec, w: suggest(e.n),
        pr: [`${g.sets} × ${g.r[0]}–${g.r[1]}، راحة ${g.rest[0]}`, `${g.sets} × ${g.r[0]}–${g.r[1]}, rest ${g.rest[1]}`] });
    } else {
      const a = ACC[p.goal] || ACC.hyp;
      add({ n: e.n, s: a[0], r: parseInt(a[1].split('–')[1], 10) || 10, rest: 75, w: lastW(e.n),
        pr: [`${a[0]} × ${a[1]}، راحة 60–90 ث`, `${a[0]} × ${a[1]}, rest 60–90 s`] });
    }
  }
  return { name: dd.l, di, days, rows, plan: pl, sig: rows.map(r => r.n).join('|') };
}

function met() {
  const sp = sport();
  return sp === 'gym' ? (GYM_MET[S.p.goal] || 5) : (SPORTS.find(x => x.id === sp).met || 5);
}

/* daily commitment (workout + water + steps), pure; commit() stores it */
function commitPct() {
  const w = clamp(waterN() / waterGoal() * 100, 0, 100), s = clamp(stepsN() / STEP_GOAL * 100, 0, 100), d = doneToday();
  let c = Math.round(((d ? 100 : 0) + w + s) / 3);
  if (d) c = Math.max(c, 50);
  return c;
}
function commit() { const c = commitPct(); S.act[today()] = c; return c; }
function streak() {
  let n = 0, o = 0;
  if (!((S.act[dkey(0)] || 0) >= 50)) o = -1;
  while ((S.act[dkey(o)] || 0) >= 50 && n < 999) { n++; o--; }
  return n;
}

function ring(p, c, l, z = 92) {
  const C = 2 * Math.PI * 34;
  return `<div style="text-align:center"><svg width="${z}" height="${z}" viewBox="0 0 80 80" role="img" aria-label="${esc(l)} ${p}%"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(p / 100 * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-size="16" font-weight="800" fill="var(--tx)">${p}%</text></svg><div class="note" style="margin:0">${esc(l)}</div></div>`;
}
function flame(z) {
  return `<svg class="fl" width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4.5 3-7 1 1.5 1 3 2 3 0-3-1-5 1-8z" fill="#D0FF00"/><path d="M12 22a3 3 0 0 0 3-3c0-2-3-3-3-6-1 2-3 3-3 6a3 3 0 0 0 3 3z" fill="#FEFFFC"/></svg>`;
}
const wdn = () => (isEn() ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] : ['أحد', 'اثن', 'ثلا', 'أرب', 'خمي', 'جمع', 'سبت']);
const pk = (a, i) => a[i % a.length][isEn() ? 1 : 0];
const dayI = () => Math.floor(Date.now() / 864e5);
const locale = () => (isEn() ? 'en' : 'ar-JO-u-nu-latn');

function wkRow(rings) {
  const n = new Date(), nm = wdn();
  let h = '<div class="wk">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(n); d.setDate(n.getDate() - n.getDay() + i);
    const k = ds(d), td = k === today(), ok = (S.act[k] || 0) >= 50;
    h += `<div>${rings ? `<span class="rg2${ok ? ' ok' : td ? ' td' : ''}">${d.getDate()}</span>` : `<span class="wc${ok ? ' ok' : td ? ' td' : ''}">${ok ? '✓' : ''}</span>`}<small>${nm[i]}</small></div>`;
  }
  return h + '</div>';
}

function bmiCard() {
  const p = S.p;
  if (p.age < 18) return `<p class="note">${t('مؤشر كتلة الجسم لا يُقرأ بنفس الجدول تحت 18 سنة، استشر مختصاً.', 'BMI is read differently under 18, so ask a specialist.')}</p>`;
  const m = p.h / 100, b = p.w / (m * m), lo = 18.5 * m * m, hi = 24.9 * m * m;
  const c = b < 18.5 ? ['نحافة', 'Underweight'] : b < 25 ? ['ضمن النطاق الصحي', 'Healthy range'] : b < 30 ? ['وزن زائد', 'Overweight'] : ['سمنة', 'Obesity'];
  const df = p.w > hi ? [`${Math.round(p.w - hi)} كغ نزولاً للوصول لأعلى النطاق الصحي`, `${Math.round(p.w - hi)} kg down to reach the top of the healthy range`]
    : p.w < lo ? [`${Math.round(lo - p.w)} كغ زيادة للوصول لأدنى النطاق الصحي`, `${Math.round(lo - p.w)} kg up to reach the bottom of the healthy range`]
    : ['وزنك ضمن النطاق الصحي', 'Your weight is within the healthy range'];
  return `<div class="card"><div class="row"><span>BMI</span><b>${b.toFixed(1)}</b></div><div class="row"><span>${t('التصنيف', 'Category')}</span><b>${pair(c)}</b></div><div class="row"><span>${t('النطاق الصحي للوزن', 'Healthy weight range')}</span><b>${Math.round(lo)}–${Math.round(hi)} kg</b></div><p class="note">${pair(df)}. ${t('المؤشر لا يميّز العضل عن الدهون، فقد يبالغ بتصنيف الرياضيين ذوي الكتلة العضلية العالية.', 'BMI cannot tell muscle from fat, so it may overrate very muscular athletes.')}</p></div>`;
}

function sessProgress(R) {
  let total = 0, done = 0;
  R.rows.forEach((e, i) => { for (let j = 0; j < e.s; j++) { total++; if (S.sess.ck[`${i}-${j}`]) done++; } });
  return { total, done };
}

function libView() {
  const f = S.f || {}, m = [];
  for (const sp of SPORTS) for (const g of (sp.id === 'gym' ? Object.keys(GOALS) : ['hyp'])) for (const d of [2, 3, 4, 5, 6]) for (const lv of LEVELS) for (const ag of AGE_BANDS) {
    if (ag[0] === 'u' && g === 'max') continue;
    if ((f.sp && f.sp !== sp.id) || (f.d && f.d !== String(d)) || (f.lv && f.lv !== lv[0]) || (f.ag && f.ag !== ag[0])) continue;
    m.push({ sp, g, d, lv, ag });

  const row = (k, a) => `<div class="chips">${a.map(x => chip(x[1], f[k] === String(x[0]), 'lf', `${k}:${x[0]}`)).join('')}</div>`;
  const shown = m.slice(0, UI.libN);
  return `<button class="bk" data-a="go" data-v="plan">${t('رجوع', 'Back')}</button><h1>${t('مكتبة البرامج', 'Program library')}</h1>
    <p class="sub">${m.length} ${t('برنامج مطابق. تُبنى القواعد العلمية لكل تركيبة (رياضة، هدف، أيام، مستوى، عمر).', 'matching programs. Science-based rules are applied to every combination (sport, goal, days, level, age).')}</p>

/* ==========================================================================
   OVERLAYS — bottom sheets, rest timer, celebration, toast
   ========================================================================== */
const ov = $('#ov'), cel = $('#cel');
let RT = {}, BA, lastFocus = null;

function openSheet(mode, html, cls = '') {
  if (!ov.classList.contains('show')) lastFocus = document.activeElement;
  ov.dataset.m = mode; ov.className = 'ov show';
  ov.innerHTML = bidi(`<div class="sh ${cls}" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`);
  ov.firstChild.focus({ preventScroll: true });
}
function closeSheet() {
  clearInterval(RT.iv);
  const was = ov.className.includes('show');
  ov.className = 'ov'; ov.dataset.m = ''; ov.innerHTML = '';
  if (was && lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function ask(msg, label, fn) {
  UI.ask = fn;
  openSheet('q', `<p style="margin-bottom:16px">${msg}</p><div class="flex" style="gap:10px;justify-content:center"><button class="bk" data-a="close">${t('تراجع', 'Back')}</button><button class="bk" style="background:var(--vi);border-color:var(--vi)" data-a="askYes">${label}</button></div>`);
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function beep() {
  if (!S.prefs.sound) return;
  try {
    const a = BA || (BA = new (window.AudioContext || window.webkitAudioContext)());
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.25, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .7);
    o.start(); o.stop(a.currentTime + .7);
  } catch (e) { /* audio unavailable */ }
}
function startRest(sec) {
  try { BA = BA || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* ignore */ }
  RT.tot = sec; RT.end = Date.now() + sec * 1000;
  openSheet('r', `<div class="mut">${t('راحة', 'Rest')}</div><svg width="150" height="150" viewBox="0 0 120 120" style="margin:6px 0" role="img" aria-label="${t('مؤقت الراحة', 'Rest timer')}"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="10"/><circle id="rc" cx="60" cy="60" r="52" fill="none" stroke="#D0FF00" stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)"/><text id="rt" x="60" y="70" text-anchor="middle" font-size="30" font-weight="800" fill="var(--tx)"></text></svg><div class="flex" style="gap:10px;justify-content:center"><button class="bk" data-a="restAdd">${t('+15 ث', '+15 s')}</button><button class="bk" data-a="close">${t('تخطّي', 'Skip')}</button></div><div class="sr-only" aria-live="polite" id="rlive"></div>`);
  clearInterval(RT.iv); RT.iv = setInterval(tick, 250); tick();
}
function tick() {
  if (ov.dataset.m !== 'r') { clearInterval(RT.iv); return; }
  const l = Math.max(0, Math.ceil((RT.end - Date.now()) / 1000)), C = 2 * Math.PI * 52, c = $('#rc');
  if (!c) return;
  c.setAttribute('stroke-dasharray', `${(l / RT.tot * C).toFixed(1)} ${C.toFixed(1)}`);
  $('#rt').textContent = `${Math.floor(l / 60)}:${pad(l % 60)}`;
  if (l <= 0) {
    clearInterval(RT.iv);
    try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { /* ignore */ }
    beep(); setTimeout(beep, 350);
    $('#rt').textContent = t('جاهز', 'Go');
    const live = $('#rlive'); if (live) live.textContent = t('انتهت الراحة', 'Rest is over');
    setTimeout(() => { if (ov.dataset.m === 'r') closeSheet(); }, 2200);
  }
}

  const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + (isEn() ? ' exercise form' : ' شرح تمرين'));
  openSheet('x', `<h2>${esc(name)}</h2><p class="sub">${esc(pair(e.pr))}</p>
    <p class="note" style="margin:0 0 14px">${q ? `${t('أفضل وزن:', 'Best weight:')} ${q.b} ${t('كغ', 'kg')}, ${t('إجمالي مرفوع:', 'Total lifted:')} ${fmt(Math.round(q.v))} ${t('كغ', 'kg')}` : t('لا يوجد تسجيل بعد لهذا التمرين', 'No records yet for this exercise')}</p>
    <div class="flex" style="gap:10px;justify-content:center"><a class="bk" style="text-decoration:none;display:inline-flex;align-items:center" href="${url}" target="_blank" rel="noopener noreferrer">${t('شاهد شرح التمرين', 'Watch a form guide')}</a><button class="bk" data-a="close">${t('إغلاق', 'Close')}</button></div>`);
}
function openSettings() {
  const p = S.p, num = (k, label) => `<div><label for="pf-${k}">${label}</label><input id="pf-${k}" type="number" inputmode="numeric" min="${LIMITS[k][0]}" max="${LIMITS[k][1]}" value="${p[k]}" data-c="prof" data-k="${k}"></div>`;
  const tog = (k, label) => `<label class="row" style="color:var(--tx);font-size:15px;margin:0" for="pref-${k}"><span>${label}</span><input id="pref-${k}" type="checkbox" style="width:24px;min-height:24px;accent-color:var(--ac)" ${S.prefs[k] ? 'checked' : ''} data-c="pref" data-k="${k}"></label>`;
  openSheet('set', `<h2>${t('الإعدادات', 'Settings')}</h2>
    <div class="card" style="text-align:start"><label for="pf-name">${t('الاسم', 'Name')}</label><input id="pf-name" type="text" maxlength="24" value="${esc(p.name)}" data-c="prof" data-k="name" autocomplete="given-name"><div class="grid" style="margin-top:10px">${num('age', t('العمر', 'Age'))}${num('h', t('الطول (سم)', 'Height (cm)'))}${num('w', t('الوزن (كغ)', 'Weight (kg)'))}</div></div>
    <div class="card" style="text-align:start">${tog('rest', t('بدء مؤقت الراحة تلقائياً', 'Start rest timer automatically'))}${tog('sound', t('صوت نهاية الراحة', 'Rest-end sound'))}</div>
    <div class="flex" style="gap:8px;flex-wrap:wrap;justify-content:center"><button class="bk" data-a="redo">${t('إعادة الإعداد', 'Redo setup')}</button><button class="bk" data-a="export">${t('تصدير بياناتي', 'Export my data')}</button><button class="bk" style="color:#ff8a8c" data-a="reset">${t('مسح كل البيانات', 'Erase all data')}</button></div>
    <button class="go plain" style="margin-top:16px" data-a="close">${t('تم', 'Done')}</button>`, 'start');
}

function celebrate(r) {
  const s = streak();
  cel.className = 'cel show';
  cel.innerHTML = bidi(`<div class="cin" role="dialog" aria-modal="true"><div class="bigfl">${flame(150)}<b>${s}</b></div><h1>${pk(PRAISE, dayI() + S.hist.length)}</h1><p class="sub">${t('سلسلة ' + s + ' يوم', 'Day streak: ' + s)}</p>${wkRow()}
    <div class="stats"><div class="stat"><b>${r.kc}</b><span>kcal</span></div><div class="stat"><b>${fmt(r.v)}</b><span>kg</span></div><div class="stat"><b>${r.m}</b><span>${t('دقيقة', 'min')}</span></div></div>
    <div class="card v" style="margin-top:12px"><b>${t('حافظ على سلسلتك', 'Keep your streak alive')}</b><p class="note">${t('أنجز نصف أهداف يومك على الأقل (تمرين، ماء، خطوات) لتستمر السلسلة.', 'Hit at least half of your daily goals (workout, water, steps) to keep the streak going.')}</p></div>
    <button class="go" data-a="celClose">${t('متابعة', 'Continue')}</button></div>`);
  const b = cel.querySelector('button'); if (b) b.focus();
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) { /* ignore */ }
}

/* ==========================================================================
   RENDER
   ========================================================================== */
const app = $('#app'), nav = $('#nav');
UI.anim = false;
function draw() {
  const root = document.documentElement;
  app.classList.toggle('anim', !!UI.anim); UI.anim = false;
  root.lang = S.lang; root.dir = isEn() ? 'ltr' : 'rtl';
  document.title = t('ميدان فِت', 'Maydan Fit');
  const fk = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.a
    ? `[data-a="${document.activeElement.dataset.a}"][data-v="${cssEsc(document.activeElement.dataset.v || '')}"]` : null;

  if (UI.phase !== 'app') {
    nav.hidden = true; nav.innerHTML = ''; app.innerHTML = bidi(PHASES[UI.phase]());
  } else {
    app.innerHTML = bidi(`<div class="pg">${(VIEWS[S.tab] || homeView)()}</div>`);
    const N = [['home', t('الرئيسية', 'Home')], ['plan', t('الخطة', 'Plan')], ['log', t('تمرين', 'Train')], ['prog', t('تقدمي', 'Progress')], ['rec', t('الاستشفاء', 'Recovery')]];
    nav.hidden = false;
    nav.innerHTML = N.map(n => {
      const on = S.tab === n[0] || (S.tab === 'lib' && n[0] === 'plan');
      return `<button ${on ? 'aria-current="page"' : ''} data-a="go" data-v="${n[0]}">${svg(IC[n[0]])}${n[1]}</button>`;
    }).join('');
  }
  if (fk) { const el = document.querySelector(fk); if (el) el.focus({ preventScroll: true }); }
}
const cssEsc = v => (window.CSS && CSS.escape ? CSS.escape(v) : String(v).replace(/[^\w-]/g, '\\$&'));
/* RTL text with numbers: "3–5 × 6–12", "2192 kcal", "8%" would render mirrored. Isolate those runs as LTR. */
const BIDI_RE = /\d[\d.,]*(?:\s?[–×]\s?\d[\d.,]*)+(?:\s?(?:kcal|kg|g|km|min|s|m)\b|%)?|\d[\d.,]*\s?(?:kcal|kg|g|km|min)\b|\d[\d.,]*%/g;
const bidi = html => (isEn() ? html : html.split(/(<[^>]+>)/).map((x, i) => (i % 2 ? x : x.replace(BIDI_RE, m => `<bdi dir="ltr">${m}</bdi>`))).join(''));
const redraw = () => { save(); draw(); };
const toTop = () => window.scrollTo(0, 0);

/* ==========================================================================
   ACTIONS (click delegation: data-a="name" data-v="value")
   ========================================================================== */
const A = {
  lang() { S.lang = isEn() ? 'ar' : 'en'; redraw(); },
  go(v) { if (ov.className.includes('show')) closeSheet(); S.tab = TABS.includes(v) ? v : 'home'; redraw(); toTop(); },
  close() { closeSheet(); },

  /* entry flow */
  signIn(v) { S.acct = { t: v }; UI.phase = 'welcome'; redraw(); toTop(); },
  emailMode() { UI.email = true; draw(); const i = $('#em'); if (i) i.focus(); },
  emailGo() { const i = $('#em'); if (!/^\S+@\S+\.\S+$/.test(i.value.trim())) { i.focus(); toast(t('أدخل بريداً صحيحاً', 'Enter a valid email')); return; } A.signIn('email'); },
  welcomeGo() { if (S.done) { UI.phase = 'app'; S.tab = 'home'; } else { UI.phase = 'intro'; UI.is = 0; } redraw(); toTop(); },
  pickSport(v) { S.sport = v; redraw(); },
  introNext() { if (UI.is < 1) { UI.is++; draw(); toTop(); } else A.introSkip(); },
  introSkip() { if (S.done) { UI.phase = 'app'; S.tab = 'home'; } else { UI.phase = 'onb'; UI.os = 0; } redraw(); toTop(); },
  obPick(v) { const k = steps()[UI.os].k; S.p[k] = (k === 'life' || k === 'days') ? +v : v; UI.os++; redraw(); toTop(); },
  obStep(v) { const k = steps()[UI.os].k, i = $('#nv'); S.p[k] = clamp(Math.round(+i.value || S.p[k]) + +v, ...LIMITS[k]); i.value = S.p[k]; save(); },
  obNext() { const k = steps()[UI.os].k, i = $('#nv'); S.p[k] = clamp(Math.round(+i.value) || S.p[k], ...LIMITS[k]); UI.os++; redraw(); toTop(); },
  obText() { const i = $('#nv'), v = i.value.trim(); if (!v) { i.focus(); toast(t('اكتب اسمك', 'Enter your name')); return; } S.p.name = v.slice(0, 24); UI.os++; redraw(); toTop(); },
  obBack() { if (UI.os === 0) { UI.phase = 'intro'; UI.is = 1; } else UI.os--; draw(); toTop(); },
  finish() { S.done = true; UI.phase = 'app'; S.tab = 'home'; redraw(); toTop(); },
  redo() { closeSheet(); S.done = false; UI.phase = 'onb'; UI.os = 0; redraw(); toTop(); },

  /* plan */
  setSport(v) { S.sport = v; S.day = 0; redraw(); },
  setGoal(v) { if (GOALS[v]) { S.p.goal = v; S.day = 0; redraw(); } },
  setDays(v) { S.p.days = clamp(+v, 2, 6); S.day = 0; redraw(); },
  setDay(v) { S.day = +v || 0; redraw(); },

  /* session */
  sessStart() { const R = dayRows(); S.sess = { t0: Date.now(), ck: {}, sig: R.sig, name: R.name }; redraw(); },
  sessCancel() { ask(t('إلغاء الجلسة الحالية؟ لن تُحفظ مجموعاتها.', 'Cancel this session? Its sets will not be saved.'), t('إلغاء الجلسة', 'Cancel session'), () => { S.sess = null; redraw(); }); },
  askYes() { const f = UI.ask; UI.ask = null; closeSheet(); if (f) f(); },
  chk(k) {
    const se = S.sess; if (!se) return;
    const [i] = k.split('-').map(Number), R = dayRows(), e = R.rows[i], row = $('#s' + k); if (!e || !row) return;
    if (se.ck[k]) {                                               // un-tick: allow corrections
      delete se.ck[k]; row.className = 'st' + (e.r ? '' : ' single');
      row.querySelectorAll('input').forEach(x => { x.disabled = false; });
      const b = row.querySelector('.cb'); b.textContent = ''; b.setAttribute('aria-pressed', 'false');
    } else {
      const w = parseFloat(($('#w' + k) || {}).value) || 0, r = parseInt(($('#r' + k) || {}).value, 10) || 0;
      se.ck[k] = { w, r };
      row.className = 'st ok' + (e.r ? '' : ' single');
      row.querySelectorAll('input').forEach(x => { x.disabled = true; });
      const b = row.querySelector('.cb'); b.textContent = '✓'; b.setAttribute('aria-pressed', 'true');
      const { total, done } = sessProgress(R);
      if (e.rest && S.prefs.rest && done < total) startRest(e.rest);
    }
    const { total, done } = sessProgress(R), pb = $('#pb'); if (pb) pb.style.width = (total ? done / total * 100 : 0) + '%';
    save();
  },
  sessFinish() {
    const se = S.sess; if (!se) return;
    const R = dayRows(), keys = Object.keys(se.ck);
    if (!keys.length) { toast(t('علّم مجموعة واحدة على الأقل', 'Tick at least one set')); return; }
    let v = 0;
    keys.sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(k => {
      const c = se.ck[k], e = R.rows[+k.split('-')[0]]; if (!e) return;
      v += c.w * c.r;
      if (c.w && c.r) {
        S.logs.push({ ex: e.n, w: c.w, r: c.r, e: 8, t: Date.now() });
        const q = S.pr[e.n] || (S.pr[e.n] = { b: 0, v: 0, l: 0 });
        q.b = Math.max(q.b, c.w); q.v += c.w * c.r; q.l = c.w;
      }
    });
    const hr = clamp((Date.now() - se.t0) / 36e5, .2, 3);          // cap: an abandoned session can't inflate calories
    const r = { d: today(), sp: sport(), nm: R.name, kc: Math.round(met() * S.p.w * hr), v: Math.round(v), n: keys.length, m: Math.round(hr * 60) };
    S.hist.push(r); S.sess = null; closeSheet(); commit(); save(); draw(); celebrate(r);
  },
  exInfo(v) { openExInfo(+v); },
  restStart(v) { startRest(+v); },
  restAdd() { RT.end += 15000; RT.tot += 15; },

  /* trackers */
  addW(v) { S.wt = { d: today(), n: Math.max(0, waterN() + +v) }; commit(); redraw(); },
  addS(v) { S.sp = { d: today(), n: Math.max(0, stepsN() + +v) }; commit(); redraw(); },
  story(v) { openStory(+v % STORIES.length); },

  /* progress & library */
  ptab(v) { S.pt = v; redraw(); },
  mo(v) { S.mo = (S.mo || 0) + +v; redraw(); },
  lf(v) { const [k, x] = v.split(':'); S.f[k] = S.f[k] === x ? null : x; UI.libN = 10; redraw(); },
  libMore() { UI.libN += 10; draw(); },
  useP(v) { const [sp, g, d, lv] = v.split('|'); S.sport = sp; S.p.goal = g; S.p.days = +d; S.p.exp = lv; S.day = 0; A.go('plan'); },

  /* settings */
  settings() { openSettings(); },
  export() {
    try {
      const b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = `maydan-fit-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) { toast(t('تعذّر التصدير', 'Export failed')); }
  },
  reset() {
    ask(t('سيتم مسح كل بياناتك من هذا الجهاز. متأكد؟', 'This erases all your data from this device. Sure?'), t('امسح كل شيء', 'Erase everything'), () => {
      try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch (e) { /* ignore */ }
      S = DEFAULTS(); UI.phase = 'welcome'; UI.os = 0; UI.is = 0; UI.anim = true; draw(); toTop();
    });
  },
  celClose() { cel.className = 'cel'; cel.innerHTML = ''; A.go('prog'); }
};

/* page-level transitions replay the entrance animation; in-place updates don't */
['go', 'signIn', 'welcomeGo', 'introNext', 'introSkip', 'obPick', 'obNext', 'obText', 'obBack', 'finish', 'redo', 'celClose'].forEach(k => {
  const f = A[k]; A[k] = function () { UI.anim = true; return f.apply(this, arguments); };
});

/* change / input delegation */
const C = {
  prof(val, el) {
    const k = el.dataset.k;
    if (k === 'name') S.p.name = val.trim().slice(0, 24);
    else { S.p[k] = clamp(Math.round(+val) || S.p[k], ...LIMITS[k]); el.value = S.p[k]; }
    save();
  },
  pref(val, el) { S.prefs[el.dataset.k] = el.checked; save(); }
};
document.addEventListener('click', e => {
  if (e.target === ov) { closeSheet(); return; }
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset.v, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-c]'); if (el && C[el.dataset.c]) { C[el.dataset.c](el.value, el, e); return; }
  if (e.target.dataset.i === 'rec') { S.rec.d = today(); save(); draw(); }          // refresh ring on release
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.i === 'rec') {                                         // live value while dragging, no re-render
    S.rec[el.dataset.k] = +el.value; const b = $('#rv-' + el.dataset.k); if (b) b.textContent = el.value;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (cel.className.includes('show')) A.celClose(); else if (ov.className.includes('show')) closeSheet(); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); A[e.target.dataset.enter](); }
});
window.addEventListener('storage', e => { if ((e.key === KEY) && e.newValue) { S = load(); draw(); } });   // keep tabs in sync

/* ==========================================================================
   BOOT
   ========================================================================== */
(function init() {
  UI.anim = true; draw();
  setTimeout(() => {
    if (UI.phase !== 'boot') return;
    UI.phase = S.acct ? 'welcome' : 'acct'; UI.anim = true; draw();
  }, 1000);
})();

})();
</script>
</body>
</html>
